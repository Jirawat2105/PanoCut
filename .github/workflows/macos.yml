name: macOS installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '**.py'
      - requirements.txt
      - packaging/**
      - .github/workflows/macos.yml
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
          cache: pip
      - run: python -m pip install -r requirements.txt 'pyinstaller>=6.11,<7'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_macos.py --format both
      - uses: actions/upload-artifact@v4
        with:
          name: PanoTess-macOS-${{ matrix.arch }}-local-test
          path: |
            dist/*.dmg
            dist/*.pkg
          if-no-files-found: error
